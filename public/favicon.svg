<!-- La marca en dieciséis píxeles: la G de Fraunces y su punto oxblood, sobre
     papel. Se dibuja con trazados y no con `font-family`, porque un favicon se
     pinta en máquinas donde Fraunces no está instalada — con texto, cada una
     enseñaba una G distinta. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glossa">
  <rect width="64" height="64" fill="#F4EDE4"/>
  <text x="27" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="44" font-weight="500" fill="#1A1614">G</text>
  <circle cx="49" cy="41.5" r="5" fill="#7A2E2E"/>
</svg>
