name: Glossa traducir (el número en español)

# Aparte del que escribe el número, y esa separación se ganó midiéndola:
# traducir es otra llamada de ~14 min a una cuenta que admite UNA petición a la
# vez. Colgada del guion que escribe, convirtió treinta minutos en cincuenta y
# dejó esperando la publicación de un número ya terminado.
#
# Domingo 11:00 UTC, una hora después del número — tiempo de sobra para que la
# cuenta haya soltado el turno. Si falla, el inglés ya está publicado y no se
# entera nadie más que el registro.
#
# Secretos: SUPABASE_SERVICE_KEY, MOONSHOT_API_KEY.

# ── El reloj de la semana ────────────────────────────────────────────────
# Todo tiene que estar TERMINADO antes de las 5:00 de la mañana en Los Ángeles,
# y con margen: una corrida de Kimi que se ralentice puede pasar de 16 minutos a
# 50, y eso ya ocurrió. La cadena, en hora de allí:
#
#   sábado  08:00  reportaje — sale a buscar fuera (cubre ya casi la semana)
#   sábado  21:00  cotejo    — comprueba afirmaciones contra documentos
#   domingo 00:30  número    — la semana cerró a medianoche; se escribe
#   domingo 01:45  español   — la traducción, aparte, para no retrasar nada
#   domingo 03:00  consejo   — mide la calibración; no urge, va al final
#
# Termina sobre las 02:00 y quedan tres horas de colchón. El consejo va DESPUÉS
# del número a propósito: usa la misma cuenta de Kimi, que admite una petición a
# la vez, y antes se solapaba con quien sí tiene prisa.

on:
  schedule:
    - cron: '45 8 * * 0'
  workflow_dispatch:
    inputs:
      semana:
        description: 'Qué semana traducir (YYYY-MM-DD). Vacío = la última sin traducir'
        required: false

permissions:
  contents: read

concurrency:
  group: glossa-traducir
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  SEMANA: ${{ inputs.semana }}

jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/traducir_from_supabase.mjs
