name: Glossa research (Fase 2 — from chat via Supabase)

# Corre la investigación pesada de una solicitud encolada desde el chat (sin git/shell en móvil).
# Cadena: chat -> POST glossa-research-enqueue (cabecera x-glossa-token)
#         -> INSERT glossa_research_requests (state='queued')
#         -> trigger glossa_research_dispatch (pg_net) -> repository_dispatch [glossa_research]
#         -> este workflow corre KB + OpenAlex + Tavily(si hay clave) -> escribe el dossier de vuelta.
#
# Secretos: SUPABASE_SERVICE_KEY (para escribir el dossier de vuelta).
#           TAVILY_API_KEY es OPCIONAL: si existe, se activa la frontera web.

on:
  repository_dispatch:
    types: [glossa_research]
  workflow_dispatch:
    inputs:
      id:
        description: 'glossa_research_requests.id'
        required: true

permissions:
  contents: read

concurrency:
  group: glossa-research-${{ github.event.client_payload.id || github.event.inputs.id }}
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENALEX_MAILTO: glossa@ademas.ai
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Resolve request id
        id: rid
        env:
          PAYLOAD_ID: ${{ github.event.client_payload.id || github.event.inputs.id }}
        run: |
          printf 'id=%s\n' "$PAYLOAD_ID" >> "$GITHUB_OUTPUT"
      - name: Run research
        env:
          REQUEST_ID: ${{ steps.rid.outputs.id }}
        run: node scripts/research_from_supabase.mjs "$REQUEST_ID"
