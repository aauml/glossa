name: Glossa weekly (número semanal)

# Escribe el número de la semana y lo deja en BORRADOR para revisarlo en /admin.
#
# Por qué el reloj está aquí y no en pg_cron: escribir el número tarda más que
# los 150 s de una edge function. Se midieron seis modelos sobre el mismo
# material —Gemini 45 s, GPT-5 104 s, Grok 169 s, Sonnet 170 s, Kimi K2.6 326 s,
# Kimi K3 952 s— y sólo el más flojo cabía. Un Action tiene seis horas.
#
# Domingos 08:30 UTC = 01:30 en California en verano y 00:30 en invierno —
# siempre DOMINGO en LA. El cron anterior (07:30 UTC) caía en sábado 23:30
# durante el horario de invierno: el guion veía la semana aún abierta,
# escribía un corte PARCIAL, y el conductor de la base lo daba por número
# hecho y saltaba a traducirlo. La semana que cubre es la que acaba de
# cerrarse, de domingo a sábado.
#
# Secretos: SUPABASE_SERVICE_KEY (ya existe), MOONSHOT_API_KEY (nuevo).

# ── El reloj de la semana ────────────────────────────────────────────────
# Todo tiene que estar TERMINADO antes de las 5:00 de la mañana en Los Ángeles,
# y con margen: una corrida de Kimi que se ralentice puede pasar de 16 minutos a
# 50, y eso ya ocurrió. La cadena, en hora de allí:
#
#   sábado  08:00  reportaje — sale a buscar fuera (cubre ya casi la semana)
#   sábado  21:00  cotejo    — comprueba afirmaciones contra documentos
#   domingo 01:30  número    — la semana cerró a medianoche; se escribe
#   domingo 03:00  consejo   — mide la calibración; usa la cuenta de Kimi
#   domingo 03:45  español   — la edición española, con su revisor Kimi, al final
#
# Termina sobre las 04:15 y queda colchón hasta las 05:00. Consejo y español van
# DESPUÉS del número a propósito: los tres usan la misma cuenta de Kimi, que
# admite una petición a la vez. Estos crons son la red: el conductor de la base
# (0063) empuja por condición y suele llegar antes.

on:
  schedule:
    - cron: '30 8 * * 0'
  workflow_dispatch:
    inputs:
      week_end:
        description: 'Rehacer otra semana: el DOMINGO que la cierra (YYYY-MM-DD, hora de Los Ángeles). Vacío = la semana recién cerrada. Cualquier otro día produce un corte parcial, que no pisa a un oficial.'
        required: false
      model:
        description: 'Modelo (kimi-k3 por defecto; kimi-k2.6 es 3x más rápido)'
        required: false

permissions:
  contents: read

concurrency:
  group: glossa-weekly
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  # El deploy hook de Vercel: al auto-publicar, un rebuild mete el número en
  # el sitemap (el RSS ya se sirve en vivo). Sin él, el guion lo dice y sigue.
  VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

jobs:
  weekly:
    runs-on: ubuntu-latest
    # Holgado porque el guion reintenta ante un 429 con esperas de hasta 15 min:
    # la cuenta admite una petición a la vez y el hueco puede tardar en soltarse.
    # El guion se rinde primero y explica por qué; esto es el corte duro de atrás.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Write the issue
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
          WEEKLY_MODEL: ${{ github.event.inputs.model }}
        run: node scripts/weekly_from_supabase.mjs
      # La tarjeta de compartir del número: se dibuja aquí, con el titular ya
      # escrito. Si fallara, el número NO se cae por eso — un enlace sin imagen
      # es peor que uno con imagen, pero mucho mejor que un número sin publicar.
      - name: Draw the share cards
        if: success()
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          node scripts/tarjetas.mjs

