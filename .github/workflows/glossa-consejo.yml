name: Glossa consejo (autocorrección con contrapeso)

# Cuando la medición dice que una etapa calibra mal, convoca a un comité de OTROS
# modelos para decidir qué corregir. La regla, copiada de thesis (D-038): el
# comité es contrapeso y no puede corregir sus propios deberes — quien analiza es
# Gemini, así que Gemini no vota sobre cómo analizar.
#
# Domingo 10:00 UTC: después del cotejo del sábado, que es lo que le da qué
# medir, y ANTES del número de las 10:00, para que este ya escriba con la
# corrección puesta si la hubo.
#
# Solo escribe en ranuras con nombre, nunca reescribe un prompt, y todo se
# revierte con un clic desde el panel.
#
# Secretos: SUPABASE_SERVICE_KEY, MOONSHOT_API_KEY, DEEPSEEK_API_KEY, OPENAI_API_KEY.

# ── El reloj de la semana ────────────────────────────────────────────────
# Todo tiene que estar TERMINADO antes de las 5:00 de la mañana en Los Ángeles,
# y con margen: una corrida de Kimi que se ralentice puede pasar de 16 minutos a
# 50, y eso ya ocurrió. La cadena, en hora de allí:
#
#   sábado  08:00  reportaje — sale a buscar fuera (cubre ya casi la semana)
#   sábado  21:00  cotejo    — comprueba afirmaciones contra documentos
#   domingo 01:30  número    — la semana cerró a medianoche; se escribe
#   domingo 03:00  consejo   — mide la calibración; usa la cuenta de Kimi
#   domingo 03:45  español   — la edición española, con su revisor Kimi, al final
#
# Termina sobre las 04:15 y queda colchón hasta las 05:00. Consejo y español van
# DESPUÉS del número a propósito: los tres usan la misma cuenta de Kimi, que
# admite una petición a la vez. Estos crons son la red: el conductor de la base
# (0063) empuja por condición y suele llegar antes.

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glossa-consejo
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  consejo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/consejo_from_supabase.mjs
