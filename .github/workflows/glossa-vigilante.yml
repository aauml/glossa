name: Glossa vigilante (salud del propio sistema)

# El panel enseñaba el estado; nadie lo vigilaba. Seis elementos pasaron horas en
# error y el número falló dos domingos seguidos, y las dos cosas las descubrió una
# persona preguntando. Un tablero que hay que mirar para enterarse no es
# vigilancia.
#
# Cada cuatro horas: detecta, recupera lo que tiene forma conocida, y anota lo
# demás con su evidencia.
#
# Lo que encuentra lo ARREGLA: reencola lo que falló por algo pasajero, pausa una
# fuente que lleva tres fallos, y relanza un trabajo caído. Solo escribe una
# incidencia cuando algo resiste tres intentos — porque entonces insistir ya no
# es la respuesta.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # `write` porque relanza los trabajos que fallaron. Avisar a una persona para
  # que le dé al botón no es vigilar: el vigilante tiene el mismo botón.
  actions: write

concurrency:
  group: glossa-vigilante
  cancel-in-progress: true

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # Para comprobar si un canal pausado sigue vivo antes de jubilarlo.
  GLOSSA_YOUTUBE_KEY: ${{ secrets.GLOSSA_YOUTUBE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Con las dos, las incidencias graves NUEVAS salen por correo; sin ellas,
  # solo quedan en el panel y el registro lo dice.
  GLOSSA_RESEND_KEY: ${{ secrets.GLOSSA_RESEND_KEY }}
  VIGILANTE_CORREO: ${{ secrets.VIGILANTE_CORREO }}

jobs:
  vigilante:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/vigilante_from_supabase.mjs

