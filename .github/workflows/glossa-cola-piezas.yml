# La cola de piezas sueltas, empujada sola.
#
# Una pieza puede quedarse esperando por cosas que se arreglan con el tiempo: el
# cupo diario de Gemini agotado, otra corrida ocupando el turno, un fallo de red.
# Nadie debería tener que darle a «retry» a mano, así que esto mira cada veinte
# minutos y lanza la más antigua si el turno está libre.
#
# Cuesta nada cuando no hay nada: mira dos filas y sale.
name: Glossa cola de piezas (reintento automático)

# Sin `schedule`: el reloj de verdad es pg_cron (`glossa_piezas_empujar`, cada
# quince minutos), porque el cron de Actions se saltó CUATRO HORAS seguidas de
# esta misma cola. Esto queda como palanca manual para empujar sin esperar.
on:
  workflow_dispatch:

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  # Para preguntar si la corrida que tiene el turno sigue viva.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cola:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/piezas_cola.mjs
