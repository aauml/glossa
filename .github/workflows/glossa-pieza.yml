name: Glossa pieza (artículo suelto desde el panel)

# Arturo pega algo en el panel marcado «for a standalone piece» y esto lo
# convierte en una pieza de la colección — digest, contexto de fuera, Kimi
# imitando la voz, MDX armados por el guion, y publicación por el worker de
# siempre. No espera al radar y el número semanal nunca lo ve.
#
# Lo dispara `glossa_pieza_dispatch(item)` (migración 0047) desde glossa-admin
# en el momento de pegar. `workflow_dispatch` queda para relanzar a mano un
# elemento que falló.
#
# Secretos: los mismos que ya existen — SUPABASE_SERVICE_KEY, GEMINI_API_KEY,
# TAVILY_API_KEY, MOONSHOT_API_KEY.

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'id del elemento en glossa_radar_items'
        required: true
      model:
        description: 'Modelo: kimi-k3 (defecto), kimi-k2.6 (3x más rápido), grok-4.20-0309-non-reasoning'
        required: false
      seco:
        description: '1 = escribir y MEDIR sin publicar (para comparar modelos)'
        required: false

permissions:
  contents: read

# Una pieza a la vez: la cuenta de Kimi admite una petición simultánea, y dos
# corridas a la vez se robarían el N° secuencial la una a la otra.
concurrency:
  group: glossa-pieza
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  # Una sola vez: sirve para las DOS cosas — traducir (cascada: Gemini gratis,
  # luego Grok, luego Haiku) y, si se pide, escribir la pieza con Grok.
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  pieza:
    runs-on: ubuntu-latest
    # Holgado por Kimi: el guion reintenta ante 429 con esperas de hasta 15 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Write the piece
        env:
          ITEM_ID: ${{ github.event.inputs.item_id }}
          PIEZA_MODEL: ${{ github.event.inputs.model }}
          PIEZA_DRY: ${{ github.event.inputs.seco }}
        run: node scripts/pieza_from_supabase.mjs

      # La tarjeta de compartir, con el titular ya escrito. Si falla no tumba
      # nada: un enlace sin imagen es peor que uno con imagen, y muchísimo mejor
      # que perder lo que se acaba de escribir.
      - name: Draw the share cards
        if: success()
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          node scripts/tarjetas.mjs

