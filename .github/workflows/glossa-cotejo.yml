name: Glossa cotejo (verificación cruzada)

# Sale a comprobar fuera lo que se afirma dentro. Es la razón de ser del
# proyecto: sin esto, «nadie lo respaldó» significa solo «nadie lo respaldó entre
# las fuentes que ya escuchamos».
#
# Domingo 04:00 UTC — sábado 21:00 en Los Ángeles, un día ANTES del número. Separado del guion semanal a
# propósito: ese ya tarda 16 minutos y es lo que no puede volverse frágil.
# Corriendo un día antes, el número siempre lee un cotejo terminado en vez de
# competir con uno a medias.
#
# Secretos: SUPABASE_SERVICE_KEY, TAVILY_API_KEY, GEMINI_API_KEY.

# ── El reloj de la semana ────────────────────────────────────────────────
# Todo tiene que estar TERMINADO antes de las 5:00 de la mañana en Los Ángeles,
# y con margen: una corrida de Kimi que se ralentice puede pasar de 16 minutos a
# 50, y eso ya ocurrió. La cadena, en hora de allí:
#
#   sábado  08:00  reportaje — sale a buscar fuera (cubre ya casi la semana)
#   sábado  21:00  cotejo    — comprueba afirmaciones contra documentos
#   domingo 01:30  número    — la semana cerró a medianoche; se escribe
#   domingo 03:00  consejo   — mide la calibración; usa la cuenta de Kimi
#   domingo 03:45  español   — la edición española, con su revisor Kimi, al final
#
# Termina sobre las 04:15 y queda colchón hasta las 05:00. Consejo y español van
# DESPUÉS del número a propósito: los tres usan la misma cuenta de Kimi, que
# admite una petición a la vez. Estos crons son la red: el conductor de la base
# (0063) empuja por condición y suele llegar antes.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glossa-cotejo
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/cotejo_from_supabase.mjs
