name: Glossa publish (from chat via Supabase)

# Publica una lectura encolada desde una superficie SIN git (chat/móvil).
# Cadena: chat -> POST glossa-enqueue (cabecera x-glossa-token)
#         -> INSERT glossa_publish_requests (state='queued')
#         -> trigger glossa_publish_dispatch (pg_net) -> repository_dispatch [glossa_publish]
#         -> este workflow materializa los MDX al repo -> Vercel despliega
#         -> escribe url_en/url_es/commit_sha de vuelta en la fila (y en glossa_issues).
#
# Secretos: SUPABASE_SERVICE_KEY. La versión anterior corría con la anon key
# PÚBLICA incrustada aquí; dejó de funcionar el 2026-07-01 (anon perdió el UPDATE)
# y, mientras funcionó, era la misma apertura que permitía encolar desde fuera.
# Ahora anon queda en INSERT/SELECT y quien escribe es la service key, en Secrets.

on:
  repository_dispatch:
    types: [glossa_publish]
  workflow_dispatch:
    inputs:
      id:
        description: 'glossa_publish_requests.id'
        required: true

permissions:
  contents: write

concurrency:
  group: glossa-publish
  cancel-in-progress: false

env:
  SUPABASE_URL: https://wtwuvrtmadnlezkbesqp.supabase.co
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # El id llega en el payload del dispatch. No lo interpolamos dentro de un
      # `run:`: va por env, así el shell nunca lo evalúa como código.
      - name: Resolve request id
        id: rid
        env:
          PAYLOAD_ID: ${{ github.event.client_payload.id || github.event.inputs.id }}
        run: |
          printf 'id=%s\n' "$PAYLOAD_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare files from Supabase
        id: prep
        env:
          REQUEST_ID: ${{ steps.rid.outputs.id }}
        run: node scripts/publish_from_supabase.mjs prepare "$REQUEST_ID"

      - name: Install & build (validate)
        run: |
          npm ci || npm install
          # El build se guarda porque su última línea de error ES el diagnóstico
          # («sortDate no coincide entre idiomas…») y antes moría aquí y a la
          # cola solo llegaba un «workflow failed» que no decía nada.
          set -o pipefail
          npm run build 2>&1 | tee /tmp/glossa-build.log

      # slug e issue_no vienen de la cola, no del repo: entran por env y se citan.
      # Interpolarlos con ${{ }} dentro de la cadena de `git commit -m` dejaría
      # que un valor con comillas se ejecutase como shell.
      - name: Commit & push
        id: push
        env:
          ISSUE_NO: ${{ steps.prep.outputs.issue_no }}
          SLUG: ${{ steps.prep.outputs.slug }}
        run: |
          git config user.name "Glossa Bot"
          git config user.email "glossa@thesis.local"
          git add src/content/articles/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "$ISSUE_NO — $SLUG (publicado desde chat)"
            # main puede haber avanzado mientras corría el build.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rechazado (intento $attempt) — rebase y reintento"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Finalize (write urls/status back)
        if: success()
        env:
          REQUEST_ID: ${{ steps.rid.outputs.id }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: node scripts/publish_from_supabase.mjs finalize "$REQUEST_ID" "$COMMIT_SHA"

      - name: Mark error on failure
        if: failure()
        env:
          REQUEST_ID: ${{ steps.rid.outputs.id }}
        # El motivo REAL, no una etiqueta: las últimas líneas con error del build
        # más el enlace a la corrida. Es lo que el panel enseña junto al retry.
        run: |
          MOTIVO=$(grep -aE "✗|error" /tmp/glossa-build.log 2>/dev/null | tail -3 | tr '\n' ' · ' | cut -c1-300)
          node scripts/publish_from_supabase.mjs fail "$REQUEST_ID" \
            "${MOTIVO:-workflow failed} — https://github.com/aauml/glossa/actions/runs/$GITHUB_RUN_ID" || true
